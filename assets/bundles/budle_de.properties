# Logs
Log.GameLoading = Spiel wird geladen...
Log.InitConsole = Konsole wird initialisiert...
Log.LoadContentSuccessfully = Inhalte erfolgreich geladen!

# Crashes
Crash.BatchNotInit = SpriteBatch ist nicht initialisiert
Crash.FontFileNotFound = Schriftdatei für {0} wurde nicht gefunden
Crash.FontIsSmall = Schriftgröße muss größer als Null sein
Crash.ManagerFontsNotInited = FontRegistry.Initialize(): Muss vor dem Anfordern von Schriftarten aufgerufen werden
Crash.FontNotReg = Schriftart ist nicht registriert